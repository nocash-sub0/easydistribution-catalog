# Бесплатный сервер Render засыпает после 15 минут без запросов, и первый посетитель ждёт его
# пробуждения до минуты. Раз в 10 минут обращаемся к нему, чтобы он оставался «тёплым».
# (750 бесплатных часов Render в месяц хватает на один сервис круглосуточно.)
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API
        run: curl --silent --show-error --max-time 90 --retry 2 -o /dev/null -w "%{http_code} %{time_total}s\n" https://easydistribution-catalog.onrender.com/config
